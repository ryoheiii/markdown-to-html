name: mdh
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        node: [20.20.0, 24.21.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Pandoc 3.8 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/jgm/pandoc/releases/download/3.8/pandoc-3.8-windows-x86_64.zip -OutFile "$env:RUNNER_TEMP/pandoc.zip"
          Expand-Archive "$env:RUNNER_TEMP/pandoc.zip" "$env:RUNNER_TEMP/pandoc"
          "$env:RUNNER_TEMP/pandoc/pandoc-3.8" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Pandoc 3.1.3 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
      - run: node setup.js
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox
      - run: npm test
      - run: npm run test:browser
